<!DOCTYPE html>

    <div class="header__banner">
      <p>20% Off Your First Order with coupon MYBABAGREENS</p>

          <img src="assets/img/logo.svg" alt="logo">

          <div class="header__nav-close" data-close-btn>
            <span></span>
            <span></span>
          </div>

            <ul class="header__nav-list">
              <li><a href="#">Shop</a></li>

        </div>

          <a href="#" class="header__button">
